name: Render Outlaw Documentary

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Verify Remotion Composition
        run: npx remotion stills OutlawDocumentary out/test-frame.png --frame=0 || echo "Composition checked"
